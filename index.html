<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroNova — Investissement intelligent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            },
            dark: {
              800: '#141a21',
              850: '#0f1419',
              900: '#0a0e13',
              950: '#06090c',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #06090c; padding-bottom: 72px; }
    .glass {
      background: rgba(15, 20, 25, 0.75);
      border: 1px solid rgba(16, 185, 129, 0.12);
    }
    .btn-primary {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    .btn-primary:hover { box-shadow: 0 0 18px rgba(16, 185, 129, 0.35); }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10, 14, 19, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(16, 185, 129, 0.15);
    }
    .nav-item.active { color: #34d399; }
    .nav-item.active svg { stroke: #34d399; }
    .product-card {
      background: linear-gradient(145deg, rgba(15,20,25,0.9), rgba(6,9,12,0.95));
      border: 1px solid rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body class="font-sans text-white antialiased min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center font-bold text-sm">A</div>
      <span class="font-semibold text-lg tracking-tight">AeroNova</span>
    </div>
    <div class="text-xs text-gray-400">Afrique de l'Ouest</div>
  </header>

  <!-- Balance Section -->
  <section class="px-4 pt-5 pb-4">
    <div class="glass rounded-2xl p-5">
      <div class="text-center mb-4">
        <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">Solde actuel (XOF)</div>
        <div id="balance" class="text-3xl font-bold text-brand-400">500.00</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button class="btn-primary py-3 rounded-xl text-sm font-semibold">Dépôt</button>
        <button class="bg-white/5 border border-white/10 py-3 rounded-xl text-sm font-semibold hover:bg-white/10 transition">Retrait</button>
      </div>
      <div class="mt-4 grid grid-cols-2 gap-3 text-center">
        <div class="bg-dark-900/60 rounded-xl py-3">
          <div class="text-[10px] text-gray-500 uppercase">Revenus d'aujourd'hui</div>
          <div class="text-lg font-semibold text-brand-400">0.00</div>
        </div>
        <div class="bg-dark-900/60 rounded-xl py-3">
          <div class="text-[10px] text-gray-500 uppercase">Revenus totaux</div>
          <div class="text-lg font-semibold">0.00</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Quick Actions -->
  <section class="px-4 pb-5">
    <div class="grid grid-cols-4 gap-3 text-center">
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-12 h-12 rounded-2xl bg-brand-600/20 border border-brand-500/30 flex items-center justify-center">
          <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </div>
        <span class="text-[11px] text-gray-300">Tourner</span>
      </button>
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-12 h-12 rounded-2xl bg-brand-600/20 border border-brand-500/30 flex items-center justify-center">
          <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        </div>
        <span class="text-[11px] text-gray-300">Échange</span>
      </button>
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-12 h-12 rounded-2xl bg-brand-600/20 border border-brand-500/30 flex items-center justify-center">
          <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </div>
        <span class="text-[11px] text-gray-300">Service</span>
      </button>
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-12 h-12 rounded-2xl bg-brand-600/20 border border-brand-500/30 flex items-center justify-center">
          <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        </div>
        <span class="text-[11px] text-gray-300">Investissements</span>
      </button>
    </div>
  </section>

  <!-- Products Title -->
  <section class="px-4 pb-3">
    <h2 class="text-base font-semibold">Liste des investissements</h2>
    <p class="text-xs text-gray-500 mt-0.5">Choisissez un plan VIP et commencez à gagner</p>
  </section>

  <!-- VIP Products -->
  <section class="px-4 space-y-4 pb-8" id="productsList">
    <!-- Products injected by JS -->
  </section>

  <!-- Fixed Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="flex items-center justify-around py-2">
      <a href="index.html" class="nav-item active flex flex-col items-center gap-0.5 py-1 px-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px] font-medium">Accueil</span>
      </a>
      <a href="#" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 text-gray-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-medium">Revenus</span>
      </a>
      <a href="#" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 text-gray-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-[10px] font-medium">Équipe</span>
      </a>
      <a href="#" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 text-gray-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] font-medium">Mien</span>
      </a>
    </div>
  </nav>

  <script>
    const products = [
      {
        id: 'vp1',
        name: 'AeroNova VP1',
        image: 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=400&h=250&fit=crop',
        daily: 2050,
        total: 4100,
        cycle: 2,
        price: 3000,
        quota: '0/50',
        badge: 'Débutant'
      },
      {
        id: 'vp2',
        name: 'AeroNova VP2',
        image: 'https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=400&h=250&fit=crop',
        daily: 1200,
        total: 21600,
        cycle: 18,
        price: 10000,
        quota: '0/40',
        badge: 'Standard'
      },
      {
        id: 'vp3',
        name: 'AeroNova VP3',
        image: 'https://images.unsplash.com/photo-1642790106117-e829e14a795f?w=400&h=250&fit=crop',
        daily: 3500,
        total: 105000,
        cycle: 30,
        price: 30000,
        quota: '0/30',
        badge: 'Avancé'
      },
      {
        id: 'vp4',
        name: 'AeroNova VP4',
        image: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=400&h=250&fit=crop',
        daily: 9000,
        total: 540000,
        cycle: 60,
        price: 80000,
        quota: '0/20',
        badge: 'Pro'
      },
      {
        id: 'vp5',
        name: 'AeroNova VP5',
        image: 'https://images.unsplash.com/photo-1639322537504-6427a16b0a28?w=400&h=250&fit=crop',
        daily: 18000,
        total: 1620000,
        cycle: 90,
        price: 150000,
        quota: '0/15',
        badge: 'Elite'
      },
      {
        id: 'vp6',
        name: 'AeroNova VP6',
        image: 'https://images.unsplash.com/photo-1620321023374-d1a68fbc720d?w=400&h=250&fit=crop',
        daily: 45000,
        total: 8100000,
        cycle: 180,
        price: 300000,
        quota: '0/10',
        badge: 'Ultimate'
      }
    ];

    const list = document.getElementById('productsList');
    list.innerHTML = products.map(p => `
      <div class="product-card rounded-2xl overflow-hidden">
        <div class="relative h-36">
          <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy"
               onerror="this.src='https://placehold.co/400x250/0a0e13/10b981?text=${encodeURIComponent(p.name)}'" />
          <div class="absolute top-3 left-3 px-2 py-0.5 rounded-full bg-brand-600/90 text-[10px] font-semibold">${p.badge}</div>
          <div class="absolute top-3 right-3 px-2 py-0.5 rounded-full bg-black/60 text-[10px]">${p.quota}</div>
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-base mb-3">${p.name}</h3>
          <div class="grid grid-cols-2 gap-2 text-sm mb-4">
            <div class="bg-dark-900/50 rounded-lg px-3 py-2">
              <div class="text-[10px] text-gray-500">Revenu quotidien</div>
              <div class="font-semibold text-brand-400">${p.daily.toLocaleString('fr-FR')} XOF</div>
            </div>
            <div class="bg-dark-900/50 rounded-lg px-3 py-2">
              <div class="text-[10px] text-gray-500">Revenu total</div>
              <div class="font-semibold">${p.total.toLocaleString('fr-FR')} XOF</div>
            </div>
            <div class="bg-dark-900/50 rounded-lg px-3 py-2">
              <div class="text-[10px] text-gray-500">Cycle</div>
              <div class="font-semibold">${p.cycle} jours</div>
            </div>
            <div class="bg-dark-900/50 rounded-lg px-3 py-2">
              <div class="text-[10px] text-gray-500">Investissement</div>
              <div class="font-semibold text-white">${p.price.toLocaleString('fr-FR')} XOF</div>
            </div>
          </div>
          <button class="w-full btn-primary py-3 rounded-xl text-sm font-semibold">
            Investir maintenant
          </button>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
